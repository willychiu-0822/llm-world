# 本機開發：docker compose up --build，然後打開 http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: longjiao_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      # NODE_ENV=development keeps the dev login available locally; production never has it.
      NODE_ENV: development
      BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/longjiao_dev
      SESSION_SECRET: local-dev-session-secret-local-dev-session
      AUTH_DEV_LOGIN: "true"
      ADMIN_EMAILS: admin@example.com
volumes:
  pgdata:
